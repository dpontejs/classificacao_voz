[project]
name = "speech-commands"
version = "0.2.0"
description = "Wav2Vec2 fine-tuned to recognise 35 spoken commands (Speech Commands v0.02)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "torch>=2.4",
    "transformers>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_commands"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The original Kaggle notebooks are kept as a historical record, not maintained code.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
